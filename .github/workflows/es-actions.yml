name: ES-Actions

on:
  push:
    branches: [ master, devtools_protocol_demo_win ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  RUNNER: tools/run-tests.py

jobs:
  build-on-windows-x64:
    runs-on: windows-2022
    steps:
    - name: Set git cllf config
      run: |
        git config --global core.autocrlf input
        git config --global core.eol lf
    - uses: Wandalen/wretry.action@v3
      with:
        action: actions/checkout@v5
        attempt_limit: 3
        attempt_delay: 10000
    # Build-only job (uploads an artifact for test262/octane-on-windows below
    # to consume) -- needs GCutil + Walrus (-DESCARGOT_WASM=ON), no test suite.
    - name: Init required submodules
      shell: bash
      run: |
        for i in 1 2 3; do
          git submodule update --init --recursive -- third_party/GCutil third_party/walrus && break
          echo "submodule update failed (attempt $i/3), retrying in 10s..." >&2
          sleep 10
        done
    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.25.0"  # <--= optional, use most recent 3.25.x version
    - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        sdk-version: 26100
    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: x64
        sdk: "10.0.26100.0"
    # ESCARGOT_LIBICU_SUPPORT_VENDORED defaults ON on windows now (see
    # build/config.cmake) -- see build-on-windows-x86's identical vcpkg step
    # for why (ICU's Windows build only ships DLLs, no static .lib), and
    # why this is cached.
    - name: Determine pinned ICU version
      shell: bash
      run: echo "ICU_VERSION_HASH=$(git ls-tree HEAD third_party/icu | awk '{print $3}')" >> "$GITHUB_ENV"
    - name: Cache vcpkg ICU
      id: cache-vcpkg-icu-win
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}\vcpkg\installed
        key: vcpkg-icu-windows-x64-${{ env.ICU_VERSION_HASH }}
    - name: Setup vcpkg ICU
      if: steps.cache-vcpkg-icu-win.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\vcpkg"
        call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat"
        "%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe" install icu --triplet=x64-windows
    # Exercises the VS solution + msbuild config path documented in
    # README.md (cmake -G "Visual Studio 17 2022" / msbuild ESCARGOT.sln)
    # that the Ninja legs (x86/arm64) never touch -- multi-config-generator-
    # specific CMake bugs (CMAKE_BUILD_TYPE is always empty at configure
    # time there; see 392a015d0) only show up on this leg. VS generator is
    # multi-config -- arch is fixed at configure time via
    # CMAKE_GENERATOR_PLATFORM (there's no single-config "MSBuild"
    # generator), config (Release) is picked at build time via --config.
    # Deliberately no CMAKE_C/CXX_COMPILER override here: the VS generator
    # manages its own MSVC toolset.
    - name: Build x64 Release (MSBuild)
      run: |
        CMake -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_VERSION:STRING="10.0" -DCMAKE_SYSTEM_PROCESSOR=x64 -DCMAKE_GENERATOR_PLATFORM=x64 -DICU_ROOT="%GITHUB_WORKSPACE%\vcpkg\installed\x64-windows" -Bout/ -DENABLE_SHELL=ON -DESCARGOT_BUILD_SHARED_LIBS=ON -DESCARGOT_LIBICU_SUPPORT=ON -DESCARGOT_WASM=ON -DESCARGOT_DEBUGGER=ON -DESCARGOT_THREADING=ON -DESCARGOT_TCO=ON -DESCARGOT_TEST=ON -DESCARGOT_SHADOWREALM=ON -G "Visual Studio 17 2022"
        CMake --build out/ --config Release
        for /f "tokens=1" %%f in ('dumpbin /dependents out\Release\escargot.exe out\Release\escargot.dll 2^>nul ^| findstr /i "icu"') do copy /Y "%GITHUB_WORKSPACE%\vcpkg\installed\x64-windows\bin\%%f" out\Release\ >nul
        rem escargot.exe/.dll only depend on icuuc/icuin directly -- icuuc.dll
        rem itself depends on icudt (the data DLL), which the pass above misses
        rem since it only inspects escargot's own import table. Re-scan the
        rem icu*.dll files just copied to pick up that transitive dependency too.
        for /f "tokens=1" %%f in ('dumpbin /dependents out\Release\icu*.dll 2^>nul ^| findstr /i "icu"') do copy /Y "%GITHUB_WORKSPACE%\vcpkg\installed\x64-windows\bin\%%f" out\Release\ >nul
      shell: cmd
    # See build-on-windows-x86's identical comment above its upload step for
    # why walrus.dll/gc-lib.dll have to be carried across explicitly.
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: build-artifact-win-x64
        path: |
          out/Release/escargot.exe
          out/Release/escargot.dll
          out/Release/walrus.dll
          out/Release/gc-lib.dll
          out/Release/icu*.dll